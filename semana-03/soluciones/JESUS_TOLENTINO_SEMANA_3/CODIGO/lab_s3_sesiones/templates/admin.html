<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #2c3e50; color: white; }
        button { background: #c0392b; color: white; border: none; padding: 6px 10px; cursor: pointer; }
        a { color: #2c3e50; }
    </style>
</head>
<body>
    <h2>Panel de Administración</h2>

    <p>
        Bienvenido, <strong>{{ name }}</strong> —
        Rol: <strong>{{ role | upper }}</strong>
    </p>

    <hr>

    <h3>Usuarios registrados</h3>

    <table>
        <thead>
            <tr>
                <th>Correo</th>
                <th>Nombre</th>
                <th>Rol</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody>
            {% for email, data in usuarios.items() %}
            <tr>
                <td>{{ email }}</td>
                <td>{{ data.nombre }}</td>
                <td>{{ data.role }}</td>
                <td>
                    <form method="POST" action="/admin/usuarios/{{ email }}/eliminar">
                        <button type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>
    <a href="/dashboard">Volver al Dashboard</a> |
    <a href="/logout">Cerrar Sesión</a>
</body>
</html>
